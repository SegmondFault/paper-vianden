# Overlay on prototype/docker-compose.yml. Paths resolve from prototype/.
x-lab: &lab
  platform: linux/amd64
  init: true
  restart: "no"
  cpus: 0.25
  mem_limit: 128m
  memswap_limit: 128m
  pids_limit: 128
  dns: [127.0.0.1]
  logging:
    driver: json-file
    options: {max-size: 5m, max-file: "2"}

services:
  web-01:
    platform: linux/amd64
    image: paper-vianden/web-01:local
  vpn-gw-01:
    platform: linux/amd64
    image: paper-vianden/vpn-gw-01:local
  db-01:
    platform: linux/amd64
    image: paper-vianden/db-01:local
    volumes:
      - ../runtime/20-dvwa.sql:/docker-entrypoint-initdb.d/20-dvwa.sql:ro
  file-01:
    platform: linux/amd64
    image: paper-vianden/file-01:local
  mail-01:
    platform: linux/amd64
    image: paper-vianden/mail-01:local
  app-01:
    platform: linux/amd64
    image: paper-vianden/app-01:local
    command: [bash, -o, pipefail, -c, "node server.js 2>&1 | tee -a /var/log/api.log"]
  admin-01:
    platform: linux/amd64
    image: paper-vianden/admin-01:local
  entry:
    platform: linux/amd64
    image: paper-vianden/entry:local
    ports: !reset []
  defender:
    platform: linux/amd64
    image: paper-vianden/toolbox:local
    build: {context: .., dockerfile: Dockerfile.labs, target: toolbox}
    mem_limit: 512m
    memswap_limit: 512m
    volumes:
      - ../upstream/ethical-hacking-docker-labs:/course:ro
      # Protocol checks only; no scenario source or instructor answer journal.
      - ../runtime/check.py:/opt/paper-vianden/runtime/check.py:ro
      - ../runtime/initialise.py:/opt/paper-vianden/runtime/initialise.py:ro
      - activity-journal:/var/log/simulated-users:ro
      - dns-evidence:/var/log/dns:ro
      - ../runtime/evidence.py:/usr/local/bin/evidence:ro
      - ../runtime/analyst.py:/usr/local/bin/analyst:ro
      - analyst-access:/run/analyst:ro
      - soc-evidence:/var/log/soc-evidence:ro
      - agent-findings:/var/lib/soc-ai

  white:
    <<: *lab
    image: paper-vianden/toolbox:local
    hostname: white
    user: "65534:65534"
    entrypoint: [/bin/bash, -c, "exec sleep infinity"]
    read_only: true
    cap_drop: [ALL]
    # UID 65534 has no effective capabilities. Only the fixed root exporter
    # uses this to read private findings from both root and green UID files.
    cap_add: [DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    environment: {HOME: /tmp}
    mem_limit: 96m
    memswap_limit: 96m
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=8m,mode=1777
    volumes:
      - ../runtime/white.py:/usr/local/bin/observe:ro
      - activity-journal:/var/log/simulated-users:ro
      - story-journal:/var/log/range-instructor:ro
      - dns-evidence:/var/log/dns:ro
      - soc-evidence:/var/log/soc-evidence:ro
      - agent-findings:/var/lib/soc-ai:ro
      - red-findings:/var/lib/soc-ai-red:ro
      - green-findings:/var/lib/soc-ai-green:ro
      - green-journal:/var/log/green-users:ro
      - ids-evidence:/var/log/security:ro
      - firewall-evidence:/var/log/firewall:ro
    # No target networks, administrator keys or Docker socket.
    networks: [management]
    healthcheck:
      test: [CMD, python3, /usr/local/bin/observe, --check]
      interval: 5s
      timeout: 3s
      retries: 18

  telemetry:
    <<: *lab
    image: paper-vianden/toolbox:local
    hostname: telemetry
    entrypoint: [python3, -u, /usr/local/bin/evidence, serve]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    memswap_limit: 192m
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16m
    volumes:
      - ./state/blue:/root/.ssh/id_ed25519:ro
      - ../runtime/evidence.py:/usr/local/bin/evidence:ro
      - ../runtime/analyst_workspace.py:/usr/local/bin/analyst_workspace.py:ro
      - analyst-access:/run/analyst
      - activity-journal:/var/log/simulated-users:ro
      - dns-evidence:/var/log/dns:ro
      - soc-evidence:/var/log/soc-evidence
      - green-journal:/var/log/green-users:ro
      - ids-evidence:/var/log/security:ro
      - firewall-evidence:/var/log/firewall:ro
    networks:
      management: {aliases: [telemetry.management]}
      dmz: {}
      internal: {}
    healthcheck:
      test: [CMD, python3, -c, "import json,time,urllib.request; s=json.load(urllib.request.urlopen('http://127.0.0.1:8088/status',timeout=3)); assert time.time()-s['last_poll']<60"]
      interval: 5s
      timeout: 4s
      retries: 24
      start_period: 30s

  activity:
    <<: *lab
    image: paper-vianden/toolbox:local
    hostname: users-01
    user: "65534:65534"
    entrypoint: [python3, -u, /opt/paper-vianden/runtime/activity.py]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.15
    mem_limit: 96m
    memswap_limit: 96m
    pids_limit: 48
    environment:
      HOME: /tmp
      PV_CLOCK_SPEED: ${PV_CLOCK_SPEED:-1}
      PV_SEED: ${PV_SEED:-20260112}
      PV_NORMAL_TRAFFIC: ${PV_NORMAL_TRAFFIC:-scripted}
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=8m,mode=1777
    volumes:
      - ../runtime:/opt/paper-vianden/runtime:ro
      - activity-journal:/var/log/simulated-users
    networks: [dmz, internal]
    healthcheck:
      test: [CMD, python3, /opt/paper-vianden/runtime/activity.py, --check]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: 1m, max-file: "2"}

  scenario-runner:
    <<: *lab
    image: paper-vianden/toolbox:local
    hostname: attacker-01
    user: "65534:65534"
    entrypoint: [python3, -u, /opt/paper-vianden/runtime/scenario_runner.py]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 96m
    memswap_limit: 96m
    pids_limit: 48
    environment:
      HOME: /tmp
      PV_ATTACKER_MODE: ${PV_ATTACKER_MODE:-scripted}
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=8m,mode=1777
    volumes:
      - ../runtime:/opt/paper-vianden/runtime:ro
      - activity-journal:/var/log/simulated-users:ro
      - story-journal:/var/log/range-instructor
    # Discovery and lateral traffic must traverse the gateway, not this actor.
    networks:
      dmz: {aliases: [attacker-01.dmz]}
    healthcheck:
      test: [CMD, python3, /opt/paper-vianden/runtime/scenario_runner.py, --check]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: 1m, max-file: "2"}

  scenario-sink:
    <<: *lab
    image: paper-vianden/toolbox:local
    hostname: scenario-sink
    user: "65534:65534"
    entrypoint: [python3, -u, /opt/paper-vianden/runtime/scenario_sink.py]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment: {HOME: /tmp}
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=4m,mode=1777
    volumes:
      - ../runtime:/opt/paper-vianden/runtime:ro
      - story-journal:/var/log/range-instructor
      - dns-evidence:/var/log/dns
    networks:
      dmz: {aliases: [scenario-sink.dmz]}
      internal: {aliases: [scenario-sink.internal]}
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/status', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 18

  red:
    <<: *lab
    image: paper-vianden/toolbox:local
    mem_limit: 512m
    memswap_limit: 512m
    hostname: red
    entrypoint: [/bin/bash, -c, "exec sleep infinity"]
    volumes:
      - ../upstream/ethical-hacking-docker-labs:/course:ro
      - red-findings:/var/lib/soc-ai
    networks: [dmz]

  green:
    <<: *lab
    image: paper-vianden/toolbox:local
    hostname: green
    user: "65534:65534"
    entrypoint: [/bin/bash, -c, "exec sleep infinity"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment: {HOME: /tmp}
    mem_limit: 192m
    memswap_limit: 192m
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16m,mode=1777
    volumes:
      - ../runtime/green.py:/usr/local/bin/green-work:ro
      - ../runtime/evidence.py:/opt/workflows/evidence.py:ro
      - green-journal:/var/log/green-users
      - green-findings:/var/lib/soc-ai
    networks: [dmz, internal]

  ldap:
    <<: *lab
    image: osixia/openldap:1.5.0
    command: --copy-service
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      LDAP_ORGANISATION: EnumCorp
      LDAP_DOMAIN: enum.lab
      LDAP_BASE_DN: dc=enum,dc=lab
      LDAP_ADMIN_PASSWORD: admin
      LDAP_TLS: "false"
    volumes:
      - ../upstream/ethical-hacking-docker-labs/labs/week5/ldap/seed.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-seed.ldif:ro
      - ../runtime/ldap-anonymous.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/99-anonymous.ldif:ro
    networks:
      internal: {aliases: [ldap.internal]}

  ldap-admin:
    <<: *lab
    image: osixia/phpldapadmin:0.9.0
    pids_limit: 256
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: ldap.internal
      PHPLDAPADMIN_HTTPS: "false"
    networks:
      internal: {aliases: [ldap-admin.internal]}

  snmp:
    <<: *lab
    image: tandrup/snmpsim:v0.4
    mem_limit: 64m
    memswap_limit: 64m
    volumes:
      - ../upstream/ethical-hacking-docker-labs/labs/week5/snmp:/usr/local/snmpsim/data:ro
    networks:
      internal: {aliases: [router.internal]}

  ftp:
    <<: *lab
    image: paper-vianden/ftp:local
    build: {context: .., dockerfile: Dockerfile.labs, target: ftp}
    volumes:
      - ./state/blue.pub:/run/blue-team.pub:ro
    networks:
      dmz: {aliases: [ftp.dmz]}

  mail:
    <<: *lab
    image: paper-vianden/mail:local
    command: [bash, -o, pipefail, -c, "dovecot -F 2>&1 | tee -a /var/log/mail.log"]
    build: {context: .., dockerfile: Dockerfile.labs, target: mail}
    volumes:
      - ./state/blue.pub:/run/blue-team.pub:ro
    networks:
      internal: {aliases: [mail.internal]}

  mail-sink:
    <<: *lab
    image: mailhog/mailhog:v1.0.1
    networks:
      dmz: {aliases: [mail-sink.dmz]}

  dvwa:
    <<: *lab
    image: paper-vianden/dvwa:local
    mem_limit: 384m
    memswap_limit: 384m
    environment:
      DB_SERVER: db-01.internal
      DB_DATABASE: dvwa
      DB_USER: dvwa
      DB_PASSWORD: p@ssw0rd
      DEFAULT_SECURITY_LEVEL: low
    networks:
      dmz: {aliases: [dvwa.dmz]}
      internal: {}

  juice-shop:
    <<: *lab
    image: bkimminich/juice-shop:v20.1.1
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 256
    networks:
      dmz: {aliases: [juice-shop.dmz]}

  phishing:
    <<: *lab
    image: gophish/gophish:0.12.1
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      ADMIN_LISTEN_URL: 0.0.0.0:3333
      ADMIN_USE_TLS: "false"
      PHISH_LISTEN_URL: 0.0.0.0:80
    networks:
      dmz: {aliases: [phishing.dmz]}

  badge:
    <<: *lab
    image: paper-vianden/badge:local
    build: {context: .., dockerfile: Dockerfile.labs, target: badge}
    volumes:
      - ./state/blue.pub:/run/blue-team.pub:ro
    networks:
      internal: {aliases: [badge.internal]}

  bof:
    <<: *lab
    image: paper-vianden/bof:local
    build: {context: .., dockerfile: Dockerfile.labs, target: bof}
    cap_add: [SYS_PTRACE]
    volumes:
      - ./state/blue.pub:/run/blue-team.pub:ro
    networks:
      internal: {aliases: [bof.internal]}

  silent:
    <<: *lab
    image: alpine:3.22
    command: [sleep, infinity]
    mem_limit: 32m
    memswap_limit: 32m
    networks: [dmz]

volumes:
  activity-journal: &journal
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=8m,uid=65534,gid=65534,mode=0755,nosuid,nodev,noexec
  story-journal: *journal
  dns-evidence: *journal
  green-journal: *journal
  soc-evidence:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=32m,mode=0755,nosuid,nodev,noexec
  agent-findings:
    driver: local
  red-findings:
    driver: local
  green-findings: *journal

  analyst-access:
    driver: local
  ids-evidence:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=24m,mode=0755,nosuid,nodev,noexec
  firewall-evidence: *journal
